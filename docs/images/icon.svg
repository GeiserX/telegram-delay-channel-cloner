<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0088CC"/>
      <stop offset="100%" style="stop-color:#0D1B2A"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="32" fill="url(#bg)"/>
  
  <!-- Telegram paper airplane (large, center-left) -->
  <g transform="translate(105,118)">
    <!-- Single clean shape -->
    <path d="M-65,10 L45,-42 L15,48 L-12,8 Z" fill="white" opacity="0.92"/>
    <!-- Fold shadow -->
    <path d="M-12,8 L45,-42 L15,48 L0,28 Z" fill="white" opacity="0.58"/>
  </g>
  
  <!-- Clock badge (upper-right) -->
  <g transform="translate(194,68)">
    <circle cx="0" cy="0" r="32" fill="rgba(0,0,0,0.35)"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="white" stroke-width="3" opacity="0.85"/>
    <!-- Hour markers (4 main positions) -->
    <line x1="0" y1="-24" x2="0" y2="-20" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="24" y1="0" x2="20" y2="0" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="24" x2="0" y2="20" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="-24" y1="0" x2="-20" y2="0" stroke="white" stroke-width="2" opacity="0.5"/>
    <!-- Hour hand (pointing at ~10:10 for visual balance) -->
    <line x1="0" y1="1" x2="-8" y2="-14" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Minute hand -->
    <line x1="0" y1="1" x2="12" y2="-8" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="3" fill="white"/>
  </g>
</svg>
